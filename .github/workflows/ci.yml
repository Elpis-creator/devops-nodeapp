name: Node.js CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy application
        shell: bash
        run: |
          set -e
          mkdir -p "$HOME/nodeapp"
          cp index.js package.json package-lock.json "$HOME/nodeapp/"
          cd "$HOME/nodeapp"
          npm ci --omit=dev

          if pm2 describe nodeapp >/dev/null 2>&1; then
            pm2 restart nodeapp --update-env
          else
            pm2 start index.js --name nodeapp
          fi

          pm2 save

      - name: Check deployment
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 2 --retry-connrefused \
            http://127.0.0.1:3000/
