
name: Node.js Docker CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Generate Docker image tags
        shell: bash
        run: |
          echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "BRANCH_TAG=${GITHUB_REF##*/}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/nodeapp:${{ env.IMAGE_TAG }}
            ${{ secrets.DOCKER_USERNAME }}/nodeapp:${{ env.BRANCH_TAG }}

  deploy:
    name: Deploy to AWS EC2
    needs: build-and-push
    runs-on: [self-hosted, Linux, X64, docker-ec2]

    steps:
      - name: Pull and deploy Docker containers
        shell: bash
        run: |
          set -e
          cd /home/ubuntu/devops-nodeapp

          docker compose pull
          docker compose up -d --no-build --remove-orphans

          docker compose ps

      - name: Verify application
        shell: bash
        run: |
          set -e
          for i in {1..15}; do
            if curl --fail --silent http://127.0.0.1:3000 | grep -q "Database: Connected"; then
              echo "Deployment successful!"
              exit 0
            fi
            sleep 2
          done

          echo "Deployment verification failed"
          exit 1
